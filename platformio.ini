; BCA182 Laboratory Activity 4 - initial HAL bring-up ONLY.
; FreeRTOS has NOT yet been integrated. Do not call this lab-compliant firmware.
; STM32F407ZGT6-compatible provisional manifest; validate against Spark-1
; oscillator, memory/linker, peripherals, schematic and ST-LINK setup.
[env:rt_spark_f407zg]
platform = ststm32
board = black_f407zg
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

; Include one FreeRTOS port and heap allocator from the STM32CubeF4 package.
extra_scripts = pre:tools/add_freertos.py
