; BCA182 Laboratory Activity 4 - STM32Cube + FreeRTOS bring-up.
; FreeRTOS scheduler is not yet runtime-validated or lab-complete.
; STM32F407ZGT6-compatible provisional manifest; validate against Spark-1
; oscillator, memory/linker, peripherals, schematic and ST-LINK setup.
[env:rt_spark_f407zg]
platform = ststm32
board = black_f407zg
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

; Cortex-M4F hardware FPU is required by FreeRTOS portable/GCC/ARM_CM4F.
; softfp permits FP instructions while retaining software-compatible call ABI.
; Keep these consistent for the HAL, FreeRTOS kernel and application.
build_flags =
    -mfpu=fpv4-sp-d16
    -mfloat-abi=softfp

; Include one FreeRTOS port and heap allocator from the STM32CubeF4 package.
extra_scripts = pre:tools/add_freertos.py
